<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ரோஷன் AI சமையல் குறிப்பு உருவாக்கி</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --background: #fdfaf6;
            --text: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background: white;
            max-width: 800px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }
        .api-key-section {
            background: #f4f6f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px dashed #b0bec5;
            text-align: center;
        }
        .api-key-section input {
            width: 80%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 10px;
            font-size: 1rem;
        }
        .api-note {
            font-size: 0.85rem;
            color: #666;
            margin-top: 8px;
        }
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .ingredient-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
            transition: 0.2s;
            font-weight: 500;
            user-select: none;
        }
        .ingredient-item:hover {
            background: #ffe3e3;
            border-color: var(--primary);
        }
        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #fa5252;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed #eee;
            padding-top: 25px;
        }
        #recipe-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
            margin-bottom: 20px;
        }
        #recipe-content {
            line-height: 1.8;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.05rem;
        }
        #recipe-content h3 {
            color: var(--primary);
            margin-top: 0;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>👨‍🍳 ரோஷன் AI சமையல் குறிப்பு</h1>

        <!-- API Key Input Section (Groq) -->
        <div class="api-key-section">
            <label for="api-key-input"><b>Groq API Key:</b></label><br>
            <input type="password" id="api-key-input" placeholder="உங்கள் Groq API Key-ஐ இங்கே ஒட்டவும்">
            <div class="api-note">🔒 இந்த Key உங்கள் பிரவுசரில் மட்டுமே பாதுகாப்பாக சேமிக்கப்படும்.</div>
        </div>

        <p style="text-align: center; color: #666;">உங்கள் சமையலறையில் உள்ள பொருட்களை தேர்ந்தெடுக்கவும்:</p>

        <div class="ingredients-grid" id="ingredients-container">
            <!-- Checkboxes will be injected here safely by JS -->
        </div>

        <button id="generate-btn" onclick="generateRecipe()">சிறந்த செய்முறையை உருவாக்கு (Generate with AI)</button>

        <div id="result">
            <div id="recipe-content"></div>
            <img id="recipe-image" src="" alt="AI உருவாக்கிய சமையல் படம்">
        </div>
    </div>

    <script>
        // தமிழ் மற்றும் ஆங்கில பெயர்களுடன் பொருட்கள்
        const ingredientsList = [
            { id: "tomato", ta: "தக்காளி", en: "tomato" },
            { id: "onion", ta: "வெங்காயம்", en: "onion" },
            { id: "garlic", ta: "பூண்டு", en: "garlic" },
            { id: "ginger", ta: "இஞ்சி", en: "ginger" },
            { id: "rice", ta: "அரிசி", en: "rice" },
            { id: "chicken", ta: "கோழி", en: "chicken" },
            { id: "fish", ta: "மீன்", en: "fish" },
            { id: "egg", ta: "முட்டை", en: "egg" },
            { id: "tuvardaal", ta: "துவரம் பருப்பு", en: "toor dal" },
            { id: "payathamparuppu", ta: "பாசிப்பருப்பு", en: "moong dal" },
            { id: "pottukadalai", ta: "பொட்டுக்கடலை", en: "roasted gram" },
            { id: "aval", ta: "அவல்", en: "flattened rice" },
            { id: "kondakalai", ta: "கொண்டைக்கடலை", en: "chickpeas" },
            { id: "potato", ta: "உருளைக்கிழங்கு", en: "potato" },
            { id: "bell_pepper", ta: "குடைமிளகாய்", en: "bell pepper" },
            { id: "oil", ta: "எண்ணெய்", en: "oil" },
            { id: "salt", ta: "உப்பு", en: "salt" },
            { id: "pepper", ta: "மிளகு", en: "black pepper" },
            { id: "sugar", ta: "சர்க்கரை", en: "sugar" },
            { id: "milk", ta: "பால்", en: "milk" }
        ];

        // HTML Load ஆனவுடன் நடக்கும் செயல்கள்
        document.addEventListener("DOMContentLoaded", () => {
            // 1. சேமிக்கப்பட்ட Groq API Key-ஐ மீட்டெடுத்தல்
            const savedKey = localStorage.getItem('roshan_groq_api_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            }

            // 2. பொருட்களை திரையில் காட்டுதல்
            const container = document.getElementById('ingredients-container');
            if (container) {
                ingredientsList.forEach(ing => {
                    const label = document.createElement('label');
                    label.className = 'ingredient-item';
                    label.innerHTML = `<input type="checkbox" value="${ing.id}"> ${ing.ta}`;
                    container.appendChild(label);
                });
            }
        });

        async function generateRecipe() {
            // Groq API Key-ஐ பெட்டியிலிருந்து எடுத்தல்
            const apiKeyInput = document.getElementById('api-key-input').value.trim();

            if (!apiKeyInput) {
                alert("தயவுசெய்து உங்கள் Groq API Key-ஐ உள்ளிடவும்!");
                document.getElementById('api-key-input').focus();
                return;
            }

            // எதிர்கால பயன்பாட்டிற்கு Key-ஐ உலாவி (Browser) Local Storage-ல் சேமித்தல்
            localStorage.setItem('roshan_groq_api_key', apiKeyInput);

            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                alert("குறைந்தபட்சம் ஒரு பொருளையாவது தேர்ந்தெடுக்கவும்!");
                return;
            }

            const selectedTa = [];
            const selectedEn = [];
            checkboxes.forEach(cb => {
                const item = ingredientsList.find(i => i.id === cb.value);
                if (item) {
                    selectedTa.push(item.ta);
                    selectedEn.push(item.en);
                }
            });

            const resultDiv = document.getElementById('result');
            const contentDiv = document.getElementById('recipe-content');
            const imgElement = document.getElementById('recipe-image');
            const btn = document.getElementById('generate-btn');

            // Loading State
            btn.disabled = true;
            btn.innerText = "AI சமைத்துக்கொண்டிருக்கிறது... ⏳";
            resultDiv.style.display = 'block';
            imgElement.style.display = 'none';
            contentDiv.innerHTML = "<div class='loading'>AI உங்களுக்காக சமையல் குறிப்பை உருவாக்குகிறது... ⏳</div>";

            resultDiv.scrollIntoView({ behavior: 'smooth' });

            try {
                // 1. AI Image Generation (Pollinations.ai)
                const imagePrompt = `Delicious traditional South Indian dish made with ${selectedEn.join(', ')}, professional food photography, appetizing, high resolution 4k`;
                const encodedPrompt = encodeURIComponent(imagePrompt);
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=400&nologo=true`;

                // 2. AI Text Generation (Groq API)
                // NOTE: "llama3-70b-8192" was retired by Groq, and its replacement
                // "llama-3.3-70b-versatile" is now Enterprise-only (Contact Sales),
                // so normal developer API keys get rejected. "openai/gpt-oss-120b" is
                // Groq's current flagship model on the regular pay-per-token tier.
                const textPrompt = `இந்த பொருட்களை மட்டும் பயன்படுத்தி ஒரு சுவையான சமையல் குறிப்பை தமிழில் உருவாக்கவும்: ${selectedTa.join(', ')}.
                பதில் HTML வடிவத்தில் மட்டுமே இருக்க வேண்டும். வேறு எந்த விளக்கமும் தேவையில்லை.
                சமையலின் பெயரை <h3> குறிச்சொல்லிலும், தேவையான பொருட்களை <ul> குறிச்சொல்லிலும், செய்முறையை <ol> குறிச்சொல்லிலும் கொடுக்கவும்.
                markdown குறியீடுகளை (உதாரணமாக \`\`\`html) பயன்படுத்த வேண்டாம். நேரடியாக HTML tags-ஐ மட்டும் தரவும்.`;

                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKeyInput}` // Groq uses Bearer token authentication
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b", // available on the regular Groq developer tier
                        messages: [
                            { role: "system", content: "You are an expert Tamil Chef. Output ONLY pure HTML code without markdown formatting." },
                            { role: "user", content: textPrompt }
                        ],
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    let detail = `${response.status} ${response.statusText}`;
                    try {
                        const errData = await response.json();
                        if (errData && errData.error && errData.error.message) {
                            detail = errData.error.message;
                        }
                    } catch (parseErr) {
                        // response body wasn't JSON; keep the status text
                    }
                    throw new Error(`Groq API Error: ${detail}. உங்கள் Key சரியாக உள்ளதா என சரிபார்க்கவும்.`);
                }

                const data = await response.json();

                if (data.error) throw new Error(data.error.message);
                if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                    throw new Error("Groq API-யிலிருந்து சரியான பதில் கிடைக்கவில்லை.");
                }

                // AI தவறாக markdown அனுப்பினால் அதை நீக்குதல்
                const cleanedRecipeHtml = data.choices[0].message.content
                    .replace(/```html/g, '')
                    .replace(/```/g, '')
                    .trim();

                // முடிவுகளை DOM-ல் காண்பித்தல்
                contentDiv.innerHTML = cleanedRecipeHtml;
                imgElement.src = imageUrl;

                // படம் முழுமையாக Load ஆன பிறகு திரையில் காட்டவும்
                imgElement.onload = () => {
                    imgElement.style.display = 'block';
                };

            } catch (error) {
                console.error(error);
                contentDiv.innerHTML = `<p style="color: red; text-align: center; padding: 20px;">மன்னிக்கவும், சமையல் குறிப்பை உருவாக்குவதில் பிழை ஏற்பட்டுள்ளது. <br><br><b>பிழை:</b> ${error.message}</p>`;
            } finally {
                // பட்டனை மீண்டும் பழைய நிலைக்கு மாற்றுதல்
                btn.disabled = false;
                btn.innerText = "சிறந்த செய்முறையை உருவாக்கு (Generate with AI)";
            }
        }
    </script>
</body>
</html>
