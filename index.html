<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ரோஷன் AI சமையல் குறிப்பு உருவாக்கி</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --background: #fdfaf6;
            --text: #2d3436;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            background: white;
            max-width: 800px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }
        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .ingredient-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
            transition: 0.2s;
            font-weight: 500;
        }
        .ingredient-item:hover {
            background: #ffe3e3;
            border-color: var(--primary);
        }
        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #fa5252;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result {
            display: none;
            margin-top: 30px;
            border-top: 2px dashed #eee;
            padding-top: 25px;
        }
        #recipe-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
            margin-bottom: 20px;
        }
        #recipe-content {
            line-height: 1.8;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            font-size: 1.05rem;
        }
        #recipe-content h3 {
            color: var(--primary);
            margin-top: 0;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>👨‍🍳 ரோஷன் AI சமையல் குறிப்பு</h1>
        <p style="text-align: center; color: #666;">உங்கள் சமையலறையில் உள்ள பொருட்களை தேர்ந்தெடுக்கவும். AI உங்களுக்கான புதிய சமையலை உருவாக்கும்!</p>
        
        <div class="ingredients-grid" id="ingredients-container">
            <!-- Checkboxes generated by JS -->
        </div>

        <button id="generate-btn" onclick="generateRecipe()">சிறந்த செய்முறையை உருவாக்கு (Generate with AI)</button>

        <div id="result">
            <div id="recipe-content"></div>
            <img id="recipe-image" src="" alt="AI உருவாக்கிய சமையல் படம்">
        </div>
    </div>

    <script>
        // ==========================================
        // முக்கியமானது: இங்கே உங்கள் GEMINI API KEY-ஐ உள்ளிடவும்
        // ==========================================
        const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"; 
        
        // தமிழ் மற்றும் ஆங்கில பெயர்களுடன் பொருட்கள் (ஆங்கிலம் AI படத்திற்காக)
        const ingredientsList = [
            { id: "tomato", ta: "தக்காளி", en: "tomato" },
            { id: "onion", ta: "வெங்காயம்", en: "onion" },
            { id: "garlic", ta: "பூண்டு", en: "garlic" },
            { id: "ginger", ta: "இஞ்சி", en: "ginger" },
            { id: "rice", ta: "அரிசி", en: "rice" },
            { id: "chicken", ta: "கோழி", en: "chicken" },
            { id: "fish", ta: "மீன்", en: "fish" },
            { id: "egg", ta: "முட்டை", en: "egg" },
            { id: "tuvardaal", ta: "துவரம் பருப்பு", en: "toor dal" },
            { id: "payathamparuppu", ta: "பாசிப்பருப்பு", en: "moong dal" },
            { id: "pottukadalai", ta: "பொட்டுக்கடலை", en: "roasted gram" },
            { id: "aval", ta: "அவல்", en: "flattened rice" },
            { id: "kondakalai", ta: "கொண்டைக்கடலை", en: "chickpeas" },
            { id: "potato", ta: "உருளைக்கிழங்கு", en: "potato" },
            { id: "bell_pepper", ta: "குடைமிளகாய்", en: "bell pepper" },
            { id: "oil", ta: "எண்ணெய்", en: "oil" },
            { id: "salt", ta: "உப்பு", en: "salt" },
            { id: "pepper", ta: "மிளகு", en: "black pepper" },
            { id: "sugar", ta: "சர்க்கரை", en: "sugar" },
            { id: "milk", ta: "பால்", en: "milk" }
        ];

        // UI-இல் பொருட்களை காண்பிக்க
        const container = document.getElementById('ingredients-container');
        ingredientsList.forEach(ing => {
            const label = document.createElement('label');
            label.className = 'ingredient-item';
            label.innerHTML = `<input type="checkbox" value="${ing.id}"> ${ing.ta}`;
            container.appendChild(label);
        });

        async function generateRecipe() {
            if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                alert("தயவுசெய்து குறியீட்டில் (Code) உங்கள் Gemini API Key-ஐ சேர்க்கவும்!");
                return;
            }

            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                alert("குறைந்தபட்சம் ஒரு பொருளையாவது தேர்ந்தெடுக்கவும்!");
                return;
            }

            // தேர்ந்தெடுக்கப்பட்ட பொருட்களின் பெயர்களை பிரித்தெடுத்தல்
            const selectedTa = [];
            const selectedEn = [];
            checkboxes.forEach(cb => {
                const item = ingredientsList.find(i => i.id === cb.value);
                selectedTa.push(item.ta);
                selectedEn.push(item.en);
            });

            const resultDiv = document.getElementById('result');
            const contentDiv = document.getElementById('recipe-content');
            const imgElement = document.getElementById('recipe-image');
            const btn = document.getElementById('generate-btn');

            // Loading state
            btn.disabled = true;
            btn.innerText = "AI சமைத்துக்கொண்டிருக்கிறது... ⏳";
            resultDiv.style.display = 'block';
            imgElement.style.display = 'none';
            contentDiv.innerHTML = "<div class='loading'>AI சமையல் குறிப்பை உருவாக்குகிறது... தயவுசெய்து காத்திருக்கவும் ⏳</div>";
            resultDiv.scrollIntoView({ behavior: 'smooth' });

            // 1. AI Image Generation (Pollinations.ai - No API Key Needed)
            // AI படத்திற்காக ஆங்கில வார்த்தைகளைப் பயன்படுத்துகிறோம்
            const imagePrompt = `Delicious South Indian dish made with ${selectedEn.join(', ')}, high quality food photography, appetizing, 4k`;
            const encodedPrompt = encodeURIComponent(imagePrompt);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=500&nologo=true`;

            // 2. AI Text Generation (Gemini API)
            const textPrompt = `இந்த பொருட்களை மட்டும் பயன்படுத்தி ஒரு சுவையான சமையல் குறிப்பை தமிழில் உருவாக்கவும்: ${selectedTa.join(', ')}. 
            பதில் HTML வடிவத்தில் இருக்க வேண்டும். 
            தலைப்பை <h3> குறிச்சொல்லிலும், தேவையான பொருட்களை <ul> குறிச்சொல்லிலும், செய்முறையை <ol> குறிச்சொல்லிலும் கொடுக்கவும். markdown குறியீடுகளை (```html) பயன்படுத்த வேண்டாம். நேரடியாக HTML-ஐ மட்டும் தரவும்.`;

            try {
                const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: textPrompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);

                let recipeHtml = data.candidates[0].content.parts[0].text;
                // Remove formatting if AI sends markdown code blocks
                recipeHtml = recipeHtml.replace(/```html/g, '').replace(/```/g, '');

                // Update DOM
                contentDiv.innerHTML = recipeHtml;
                imgElement.src = imageUrl;
                
                // Show image once loaded
                imgElement.onload = () => {
                    imgElement.style.display = 'block';
                };

            } catch (error) {
                contentDiv.innerHTML = `<p style="color: red;">மன்னிக்கவும், சமையல் குறிப்பை உருவாக்குவதில் பிழை ஏற்பட்டுள்ளது: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "சிறந்த செய்முறையை உருவாக்கு (Generate with AI)";
            }
        }
    </script>
</body>
</html>
